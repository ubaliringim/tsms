name: Stage 1 validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  # Disposable infrastructure endpoints for an ephemeral GitHub Actions runner.
  # These deliberately match the documented local-development values in
  # infrastructure/docker-compose.yml so that CI exercises the same real
  # credentials a developer uses. They are throwaway and valid nowhere else, and
  # they are not secrets. No production credential is required by this workflow.
  DATABASE_URL: postgresql://tsms:tsms_local_development@127.0.0.1:5432/tsms
  REDIS_URL: redis://:tsms_local_redis@127.0.0.1:6379
  # Stage 2.4 requires an explicit browser-origin allowlist in every environment.
  # The API fails to start without it, and the values here are throwaway loopback
  # origins that match the documented local development ports. CI exercises the
  # Origin guard only through its own tests; the smoke checks hit /health and /ready.
  API_TRUSTED_ORIGINS: http://127.0.0.1:3000,http://127.0.0.1:3001
  # Stage 2.5 password recovery. No email provider is authorized, so delivery stays
  # disabled and the recovery endpoints fail closed. The loopback URL base is only
  # here so the configuration shape is exercised; nothing is delivered.
  API_PASSWORD_RECOVERY_DELIVERY_MODE: disabled
  # The safety guards in packages/database and packages/redis require the
  # database name to end in _test, a loopback host, and a non-zero Redis logical
  # database. These values satisfy exactly that and nothing more.
  TEST_DATABASE_URL: postgresql://tsms:tsms_local_development@127.0.0.1:5432/tsms_test
  TEST_REDIS_URL: redis://:tsms_local_redis@127.0.0.1:6379/1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Prisma Client is generated into packages/database/src/generated, which is
      # gitignored. packages/database's build and typecheck scripts run
      # `prisma generate` first, so a fresh checkout builds. This explicit step
      # surfaces generation problems here rather than inside the build.
      - run: pnpm db:generate

      # Docker Compose is used rather than job `services:` so that CI validates
      # the same compose file developers use. `migrate deploy` creates the test
      # database if it is missing, and the integration command applies migrations
      # before running, so no separate provisioning step is needed.
      - run: pnpm infra:up

      # Unit tests are Docker-free by design and must stay runnable without
      # infrastructure. They are part of `pnpm check`.
      - run: pnpm check

      # Integration tests run explicitly, against the Compose services.
      - run: pnpm test:integration

      - run: pnpm mobile:check
      - run: pnpm mobile:export
      - run: pnpm smoke

      # Stop the services so the job leaves no containers running.
      - if: always()
        run: pnpm infra:down

      - run: git diff --exit-code

  # Deliberately a separate job from `validate`.
  #
  # `pnpm audit --audit-level=high` currently exits non-zero because of two
  # owner-accepted but unresolved high-severity advisories (node-forge
  # GHSA-86w9-cpqp-85rv and braces GHSA-vfj7-8cjw-p6xm). Neither has an upstream
  # patch, so this job fails on every run until upstream state changes. That is
  # the correct, intended signal and is NOT suppressed.
  #
  # Keeping it separate means a failure here is unambiguously the known
  # security-policy gate rather than a functional regression in the `validate`
  # job. The overall workflow still reports red. There is no continue-on-error,
  # no advisory ignore list, no threshold reduction, and no severity downgrade.
  #
  # See docs/security/DEPENDENCY_RISK_REGISTER.md for the accepted dispositions
  # and their review triggers.
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency security audit (expected to fail on accepted advisories)
        run: pnpm audit --audit-level=high
